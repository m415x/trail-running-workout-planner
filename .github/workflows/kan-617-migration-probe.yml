name: KAN-617 migration probe

on:
  push:
    branches:
      - feat/KAN-601-identity-memberships
    paths:
      - '.github/workflows/kan-617-migration-probe.yml'
      - 'db/schema.ts'
      - 'db/supabase/schema.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate migrations
        run: |
          pnpm db:sqlite:generate
          pnpm db:supabase:generate
      - name: Verify generated scope
        shell: bash
        run: |
          sqlite_sql="$(ls drizzle/sqlite/0018_*.sql)"
          pg_sql="$(ls drizzle/supabase/0031_*.sql)"
          grep -q 'team_memberships' "$sqlite_sql"
          grep -q 'team_memberships' "$pg_sql"
          ! grep -Eq '__new_athlete_profiles|DROP TABLE .?athlete_profiles' "$sqlite_sql"
          ! grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+.?team_memberships.*(users|athlete_profiles)' "$sqlite_sql"
          ! grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+.?team_memberships.*(users|athlete_profiles)' "$pg_sql"
          git status --short drizzle/sqlite drizzle/supabase
      - name: Emit generated artifacts for connector promotion
        shell: bash
        run: |
          emit() {
            local key="$1"
            local file="$2"
            echo "KAN617_ARTIFACT_BEGIN:$key:$(basename "$file")"
            gzip -c "$file" | base64 -w0
            echo
            echo "KAN617_ARTIFACT_END:$key"
          }
          emit SQLITE_SQL "$(ls drizzle/sqlite/0018_*.sql)"
          emit SQLITE_SNAPSHOT drizzle/sqlite/meta/0018_snapshot.json
          emit SQLITE_JOURNAL drizzle/sqlite/meta/_journal.json
          emit PG_SQL "$(ls drizzle/supabase/0031_*.sql)"
          emit PG_SNAPSHOT drizzle/supabase/meta/0031_snapshot.json
          emit PG_JOURNAL drizzle/supabase/meta/_journal.json
