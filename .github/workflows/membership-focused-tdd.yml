name: Membership focused TDD

on:
  push:
    branches:
      - feat/KAN-580-quick-individual-payments
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Confirm exact revision
        run: |
          echo "Expected: ${{ github.sha }}"
          echo "Checked out: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Run focused membership contract tests
        run: pnpm exec tsx --test tests/memberships/kan-62*.test.ts
      - name: Lint focused Membership files
        run: pnpm exec eslint features/memberships/components/QuickPaymentDialog.tsx lib/memberships/quick-payment-*.ts tests/memberships/kan-62*.test.ts
      - name: TypeScript diagnostics (repository baseline, not a GREEN gate)
        continue-on-error: true
        run: pnpm exec tsc --noEmit --pretty false
