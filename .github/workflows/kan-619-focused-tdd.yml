name: KAN-619 focused TDD

on:
  push:
    branches:
      - feat/KAN-601-identity-memberships
    paths:
      - '.github/workflows/kan-619-focused-tdd.yml'
      - 'tests/identity/kan-619-history-preservation.test.ts'
      - 'lib/identity/team-membership-lifecycle.ts'
      - 'lib/athletes/athlete-profile-lifecycle.ts'
      - 'app/actions/athlete-actions.ts'
  workflow_dispatch:

concurrency:
  group: kan-619-focused-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact RED commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: adb0a507dac1894e8e7ba6186b2147693751fd48
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Confirm expected RED
        shell: bash
        run: |
          set +e
          pnpm exec tsx --test tests/identity/kan-619-history-preservation.test.ts > /tmp/kan-619-red.log 2>&1
          status=$?
          cat /tmp/kan-619-red.log
          test "$status" -ne 0
          grep -E "team-membership-lifecycle|athlete-profile-lifecycle|ERR_MODULE_NOT_FOUND|Cannot find module" /tmp/kan-619-red.log

  green-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify exact revision
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: KAN-619 focused behavior
        run: pnpm exec tsx --test tests/identity/kan-619-history-preservation.test.ts
      - name: TypeScript
        run: pnpm tsc
